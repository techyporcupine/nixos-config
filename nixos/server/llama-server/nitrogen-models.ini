[*]
sleep-idle-seconds = 1800
jinja = true
fa = on
fitt = 0
# temporary: surface llama.cpp's per-device memory breakdown so fitt margins
# can be set from measurements rather than derived from OOM sizes. Drop back
# to the default once the compute-buffer sizes have been captured.
verbosity = 5
# no-mmproj = true
no-mmap = true
offline = true

[fast]
hf = unsloth/Qwen3.5-9B-GGUF:Q4_K_M
mmproj = /home/nitrogen/mmproj-BF16.gguf
# dev = ROCM0 covers the text model only; mtmd/clip picks its own backend and
# lands the 879 MiB projector on CUDA0, where it collides with smart. Keep the
# projector on CPU so the 12 GiB card stays free for smart's share of the split.
no-mmproj-offload = true
dev = ROCM0
sleep-idle-seconds = -1
load-on-startup = true
ctk = q8_0
ctv = q8_0
fit = off
reasoning = off
c = 131072
temp = 0.7
top-k = 20
min-p = 0.0
top-p = 0.80
presence-penalty = 1.5
repeat-penalty = 1.0

[smart]
hf = unsloth/Qwen3.8-27B-GGUF:Q5_K_M
dev = CUDA0,ROCM0
sleep-idle-seconds = -1
load-on-startup = true
reasoning = off
spec-type = draft-mtp
ctk = q8_0
ctv = q8_0
# ub 2048 is deliberate: gfx906 has no matrix cores, so a large ubatch is what
# gets prompt processing into real GEMMs on the MI50. It costs nothing at
# token-gen time, but it scales the compute buffers roughly linearly.
ub = 2048
# fit does not budget for the draft-mtp context, which is built after the main
# context and needs a comparable compute buffer (1296 MiB observed on ROCm0,
# ~1044 MiB derived for CUDA0). fitt is the margin left FREE per device, so
# fitt = 0 guaranteed the OOM. Single value broadcasts to both devices.
fitt = 2048
temp = 0.6
top-k = 20
min-p = 0.0
top-p = 0.95
presence-penalty = 0.0
repeat-penalty = 1.0

[medium]
hf = unsloth/Qwen3.6-35B-A3B-GGUF:UD-Q5_K_M
sleep-idle-seconds = -1
reasoning = off
dev = CUDA0,ROCM0
ub = 2048
ctk = q8_0
ctv = q8_0
fitt = 0
temp = 0.6
top-k = 20
min-p = 0.0
top-p = 0.95
presence-penalty = 0.0
repeat-penalty = 1.0

