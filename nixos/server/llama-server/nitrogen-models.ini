[smart]
hf = unsloth/Qwen3.8-27B-GGUF:Q5_K_M
dev = CUDA0,ROCM0
no-mmproj = true
sleep-idle-seconds = -1
reasoning = off
spec-type = draft-mtp
ctk = q8_0
ctv = q8_0
ub = 2048
# fit's own search settles on ctx=56576 early (verified via a verbosity=5 capture:
# it tries n_ctx_train=262144 and the -fitc floor=4096 as brackets, then only
# searches layer splits at 56576 rather than continuing to search for the largest
# ctx the margin allows) and stops there well clear of fitt's margin on both
# devices (~3.3 GiB free on CUDA0, ~6.6 GiB free on ROCm0 at the time). Pinning c
# here keeps fit's layer-split search (which it's good at) while overriding its
# premature ctx choice. 131072 matches fast's ctx and leaves comfortable margin
# per the measured per-device bytes/token (CUDA0 ~10.9KiB/tok, ROCm0 ~23.4KiB/tok).
c = 131072
fitt = 2048
temp = 0.6
top-k = 20
min-p = 0.0
top-p = 0.95
presence-penalty = 0.0
repeat-penalty = 1.0

