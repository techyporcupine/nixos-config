[*]
sleep-idle-seconds = 1800
jinja = true
fa = on
fitt = 0
# no-mmproj = true
no-mmap = true
offline = true

[fast]
hf = unsloth/Qwen3.5-9B-GGUF:Q4_K_M
mmproj = /home/nitrogen/mmproj-BF16.gguf
# dev = ROCM0 covers the text model only; mtmd/clip picks its own backend and
# lands the 879 MiB projector on CUDA0, where it collides with smart. Keep the
# projector on CPU so the 12 GiB card stays free for smart's share of the split.
no-mmproj-offload = true
dev = ROCM0
sleep-idle-seconds = -1
load-on-startup = true
ctk = q8_0
ctv = q8_0
fit = off
reasoning = off
c = 131072
temp = 0.7
top-k = 20
min-p = 0.0
top-p = 0.80
presence-penalty = 1.5
repeat-penalty = 1.0

[smart]
hf = unsloth/Qwen3.8-27B-GGUF:Q5_K_M
dev = CUDA0,ROCM0
sleep-idle-seconds = -1
# deliberately NOT load-on-startup. smart is the only model using fit, and fit
# measures free VRAM at load time. Racing fast's allocation is what produced the
# intermittent OOMs. tp.server.llama-server.warmup loads it after fast is ready,
# so fit always sees a settled card. sleep-idle-seconds = -1 keeps it resident.
reasoning = off
spec-type = draft-mtp
ctk = q8_0
ctv = q8_0
# ub 2048 is deliberate: gfx906 has no matrix cores, so a large ubatch is what
# gets prompt processing into real GEMMs on the MI50. It costs nothing at
# token-gen time, but it scales the compute buffers roughly linearly.
ub = 2048
# fitt is the margin left FREE per device, and fit does not budget for the
# draft-mtp context at all -- so fitt = 0 guaranteed an OOM. Measured cost of
# the MTP context, which lands entirely on ROCm0:
#     ROCm0 KV 1024.00 MiB + ROCm0 compute 1296.06 MiB = 2320.06 MiB
#     CUDA0 0 MiB (its overflow goes to CUDA_Host pinned RAM, 1104.07 MiB)
# 2048 broadcast leaves ROCm0 ~1 GiB free at rest, which is thin but stable --
# all of llama.cpp's buffers here are reserved up front. Raising it further is
# a bad trade: ROCm0 holds ~25.5 KiB/token of KV, so every extra GiB of margin
# costs ~40k tokens of context.
fitt = 2048
temp = 0.6
top-k = 20
min-p = 0.0
top-p = 0.95
presence-penalty = 0.0
repeat-penalty = 1.0

