# GPU Fan Control Configuration for AMD Instinct MI50
# Automatically resolves sysfs paths by chip name and sensor label

# Temperature sensor source
# Uses chip name (e.g. amdgpu) and sensor label (junction/edge/mem) or sensor name (temp2_input)
temp_chip = amdgpu
temp_label = junction

# PWM output (motherboard fan header)
# Uses chip name (e.g. nct6791) and fan header channel
pwm_chip = nct6791
pwm_channel = 3

# Temperature thresholds (Celsius)
min_temp = 45
max_temp = 105

# PWM bounds (0-255)
# min_pwm: idle speed, max_pwm: full blast
min_pwm = 80
max_pwm = 255

# Polling interval (seconds)
interval = 3

# Hysteresis (minimum PWM delta before issuing write to avoid jitter)
hysteresis_pwm = 2
